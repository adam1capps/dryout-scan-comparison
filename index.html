<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReDry Scan Comparison</title>
    <meta
      name="description"
      content="Moisture scan comparison reports for ReDry drying jobs."
    />

    <!--
      Per-job link-preview (OG/Twitter) tags are intentionally absent from the
      platform shell: a preview scraper reads this static HTML and never runs
      the bundle, so job-specific tags must be generated per job from the job
      manifest (PLAN.md Phase 1), not hardcoded here.
    -->
    <meta name="theme-color" content="#1E2C55" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f4f5f7;
      }
      body {
        font-family: "DM Sans", Verdana, Geneva, Tahoma, sans-serif;
        color: #333;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: #1e2c55;
      }
      a:hover {
        color: #00bd70;
      }
      input,
      select,
      button,
      textarea {
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
